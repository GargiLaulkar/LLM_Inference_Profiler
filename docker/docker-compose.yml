services:

  # ─── vLLM OpenAI-compatible serving engine ─────────────────────────────────
  vllm:
    image: vllm/vllm-openai:v0.31.0
    container_name: llmprof_vllm
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command:
      - "${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-1024}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.65}"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "${VLLM_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    networks:
      - llmprof

  # ─── Prometheus metrics store ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: llmprof_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - vllm
    networks:
      - llmprof
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Grafana dashboards ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    container_name: llmprof_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme_strong_password_here}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/llm_profiler_main.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - llmprof
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Profiler Exporter placeholder (teammates enable this) ──────────────────
  profiler_exporter:
    image: python:3.13-slim
    container_name: llmprof_profiler_exporter
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - PROFILER_EXPORTER_PORT=${PROFILER_EXPORTER_PORT:-9101}
    command:
      - /bin/sh
      - -lc
      - >
        PYTHONPATH=/workspace python -c "from llm_profiler.instrumentation import run_exporter; run_exporter(host='0.0.0.0', port=int(__import__('os').environ.get('PROFILER_EXPORTER_PORT', '9101')) )"
    volumes:
      - ../:/workspace:ro
    ports:
      - "${PROFILER_EXPORTER_PORT:-9101}:9101"
    networks:
      - llmprof
    depends_on:
      - vllm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── GPU Collector (M3: pynvml Prometheus Exporter) ─────────────────────────
  gpu_collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu_collector
    image: llmprof_gpu_collector:latest
    container_name: llmprof_gpu_collector
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - GPU_COLLECTOR_PORT=${GPU_COLLECTOR_PORT:-9102}
    ports:
      - "${GPU_COLLECTOR_PORT:-9102}:9102"
    volumes:
      - "../results/deep_dive:/data/deep_dive:ro"
    command:
      - "--memory-breakdown-file"
      - "/data/deep_dive/memory_breakdown.json"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llmprof
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hf_cache:
  prometheus_data:
  grafana_data:

networks:
  llmprof:
    driver: bridge
